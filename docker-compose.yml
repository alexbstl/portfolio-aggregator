services:
  portfolio:
    build: .
    container_name: portfolio-aggregator
    restart: unless-stopped
    # Bind to localhost only — don't expose to the network. Put behind
    # a reverse proxy / Tailscale / SSH tunnel if you need remote access.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env                     # must include APP_TOKEN (app fails closed without it)
    environment:
      - DATABASE_PATH=/data/portfolio.db
      - SYNC_INTERVAL_MINUTES=15
    # Defense in depth. The image runs as non-root (uid 10001); ensure the
    # host ./data dir is owned by 10001 (see Dockerfile note).
    security_opt:
      - no-new-privileges:true
    # Optional further hardening — enable once verified. read_only requires the
    # yfinance cache to have a writable home; if it errors, mount a tmpfs for it.
    # read_only: true
    # tmpfs:
    #   - /tmp
